"$schema" = 'https://starship.rs/config-schema.json'

# Two-line prompt: one subtle surface0 block (dir + git + env), input below.
# Git and env modules share the dir background; only their fg color differs.
format = """
[](surface0)\
$os\
$nix_shell\
$directory\
$git_branch\
$git_status\
$python\
[ ](bg:surface0)\
[](fg:surface0)\
$fill\
$cmd_duration\
$line_break\
$character"""

# Bump if you ever hit slow git status in large repos (ms).
command_timeout = 1000
add_newline = true

palette = 'catppuccin_mocha'

[fill]
symbol = ' '

[os]
disabled = false
style = "bg:surface0 fg:subtext0"
format = "[ $symbol]($style)"

[os.symbols]
Windows = ""
# Macos = ""
Macos = ""
Linux = ""

[directory]
style = "bg:surface0 fg:text"
format = "[ $path]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

# Subtle git: same surface0 background as the path, just a lavender fg + icon.
[git_branch]
symbol = ""
style = "bg:surface0 fg:teal"
format = "[ $symbol $branch]($style)"

[git_status]
style = "bg:surface0 fg:peach"
format = "[$conflicted$staged$modified$renamed$deleted$untracked$stashed$ahead$behind$diverged]($style)"
conflicted = "[ • $count conflict](fg:red bg:surface0)"
staged     = "[ • $count staged](fg:green bg:surface0)"
modified   = "[ • $count unstaged](fg:yellow bg:surface0)"
untracked  = "[ • $count untracked](fg:overlay1 bg:surface0)"
renamed    = "[ • $count renamed](fg:blue bg:surface0)"
deleted    = "[ • $count deleted](fg:red bg:surface0)"
stashed    = "[ • $count stashed](fg:mauve bg:surface0)"
ahead      = "[ • ⇡$count ahead](fg:teal bg:surface0)"
behind     = "[ • ⇣$count behind](fg:teal bg:surface0)"
diverged   = "[ • ⇡$ahead_count ⇣$behind_count diverged](fg:teal bg:surface0)"

# Env indicators (share the surface0 block, distinct fg).
[nix_shell]
symbol = ""
style = "bg:surface0 fg:sky"
format = "[ $symbol $state]($style)"

[python]
symbol = ""
style = "bg:surface0 fg:yellow"
# Only show in a virtualenv, and show the venv name only (no Python version).
format = "[ $symbol $virtualenv]($style)"
detect_extensions = []
detect_files = []
detect_folders = []
detect_env_vars = ["VIRTUAL_ENV"]

[cmd_duration]
min_time = 500
style = "fg:subtext0"
format = "[  $duration ]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
